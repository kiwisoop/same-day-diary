<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3년 다이어리</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <svg class="bookmark-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path d="M4 2v20l8-6 8 6V2H4z" fill="currentColor"/>
        </svg>
        <h1 class="app-title">3년 다이어리</h1>
      </div>
    </header>

    <div class="main-wrapper">
      <aside class="sidebar">
        <section class="calendar-panel">
          <div class="calendar-header">
            <label for="select-start-year" class="year-label">시작 연도</label>
            <select id="select-start-year" class="year-select">
              <option value="1900">1900</option>
              <option value="1950">1950</option>
              <option value="2024" selected>2024</option>
              <option value="2050">2050</option>
              <option value="2097">2097</option>
            </select>
          </div>

          <div class="month-nav">
            <button aria-label="이전 달" id="btn-prev-month" class="btn-nav-month">‹</button>
            <span id="display-month" class="month-display">11월</span>
            <button aria-label="다음 달" id="btn-next-month" class="btn-nav-month">›</button>
          </div>

          <label class="year-label" for="calendar-year">달력 기준 연도</label><select id="calendar-year" class="year-select"></select>
          <table class="calendar-table" aria-label="달력">
            <thead>
              <tr>
                <th>일</th>
                <th>월</th>
                <th>화</th>
                <th>수</th>
                <th>목</th>
                <th>금</th>
                <th>토</th>
              </tr>
            </thead>
            <tbody id="calendar-body">
            </tbody>
          </table>

          <button id="btn-today" class="btn-today">오늘</button>
        </section>

        <section class="demo-panel">
          <button id="btn-load-demo" class="btn-demo">시연 기록 불러오기</button>
          <a href="/demo/shorts" class="btn-demo long-demo-link">쇼츠 예시 보기</a>
          <button id="btn-saved-shorts" class="btn-demo" type="button">보관한 쇼츠</button>
          <button id="three-year-video" class="btn-demo" type="button">3년 쇼츠 만들기</button>
          <p class="demo-label">시연 기록은 발표용 가상 일기예요</p>
        </section>
        <details id="image-settings" class="image-settings">
          <summary>수채화 생성 설정</summary>
          <p>GPT Image 2.5 Sunburst<br>한 번에 1장 · 약 15크레딧</p>
          <p id="image-api-status" role="status">연결 설정 확인 중…</p>
          <label><input type="checkbox" id="image-consent" disabled> 일기 저장 시 수채화 생성에 동의</label>
          <p>일기 본문이 학교 이미지 서비스로 전송돼요. 내용이 바뀌지 않았으면 그림을 다시 만들지 않아요.</p>
        </details>
      </aside>

      <main class="content-area">
        <div class="date-selector">
          <button aria-label="전날" id="btn-prev-day" class="btn-day-nav">‹</button>
          <div><div id="display-date" class="date-display">11월 17일</div><p class="date-subtitle">같은 날, 쌓여가는 세 해의 이야기</p><p id="daily-question" class="daily-question"></p><p id="daily-cheer" class="daily-cheer" aria-live="polite"></p><div id="past-banner" class="past-banner" role="status" aria-live="polite" hidden><span id="past-banner-text"></span> <button id="past-banner-read" type="button">지난 기록 먼저 읽기</button></div></div>
          <button aria-label="다음 날" id="btn-next-day" class="btn-day-nav">›</button>
        </div>

        <div id="diary-sections" class="diary-sections">
        </div>
      </main>
    </div>
  </div>

  <dialog id="dialog-shorts" aria-labelledby="shorts-title" class="dialog-info shorts-dialog">
    <h2 id="shorts-title">이 일기로 쇼츠 만들기</h2>
    <p id="shorts-date" class="demo-label"></p>
    <ol id="shorts-story" class="shorts-story" aria-label="장면 문장"></ol>
    <p class="demo-label shorts-hint">문장을 누르면 고칠 수 있어요. 자막과 목소리에 그대로 쓰여요.</p>
    <textarea id="shorts-captions" hidden></textarea>
    <button id="retry-story" class="btn-delete" hidden>이야기 다시 구성</button>
    <div class="shorts-options">
      <label><input type="checkbox" id="shorts-ai-video"> AI 영상으로 움직이기 <span id="shorts-video-cost" class="demo-label"></span></label>
      <label class="narration-option" hidden><input type="checkbox" id="shorts-narration" checked> 자막 읽어 주기</label>
    </div>
    <p id="shorts-status" role="status"></p>
    <div class="shorts-actions">
      <button id="make-shorts" class="btn-save" disabled>쇼츠 만들기</button>
      <button id="close-shorts" class="btn-delete">닫기</button>
    </div>
    <video id="shorts-video" controls playsinline hidden></video>
    <a id="download-shorts" download="오늘의일기_쇼츠.mp4" hidden>MP4 저장</a>
    <p id="shorts-music-credit" class="demo-label"></p>
  </dialog>
  <dialog id="dialog-videos" class="dialog-info shorts-dialog" aria-labelledby="videos-title">
    <h2 id="videos-title">보관한 쇼츠</h2>
    <p id="videos-status" role="status"></p>
    <div id="saved-videos"></div>
    <button id="close-videos" class="btn-delete">닫기</button>
  </dialog>
  <dialog id="dialog-image" class="dialog-image">
    <div class="dialog-content">
      <img id="dialog-image-preview" alt="수채화 확대 이미지">
      <button id="btn-close-image" class="btn-close-dialog">닫기</button>
    </div>
  </dialog>

  <dialog aria-labelledby="dialog-title" id="dialog-info" class="dialog-info">
    <div class="dialog-content">
      <h2 id="dialog-title"></h2>
      <p id="dialog-message"></p>
      <button id="btn-close-info" class="btn-modal">확인</button>
    </div>
  </dialog>

  <div id="status-message" class="status-message" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
